<!-- This page used to be "How VLAP Reads Language". It now sends readers to the
     VLAP surface itself at vlap-standalone.gotovasl.com, which shows the same
     thing working rather than describing it.

     WHY A META REFRESH AND NOT A 301. gotovasl.com is served from the S3 REST
     endpoint, not the S3 website endpoint, so object-level redirect metadata
     (x-amz-website-redirect-location) is ignored. A true 301 belongs in the
     CloudFront viewer-request function `vasl-marketing-viewer-request`, which
     is Terraform-managed in VASL-PLATFORM/infra/aws/static-sites — a separate
     repo and a terraform apply against the live distribution. This page ships
     through the normal site/ deploy and needs neither.

     noindex,follow is deliberate: the old URL should drop out of the index
     rather than compete with the destination, but the outbound link should
     still be crawled. -->
