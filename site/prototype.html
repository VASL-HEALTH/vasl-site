<!-- /prototype.html was taken down in #20 because its content was not true: it
     carried metrics retired on 25 Sept, four invented customer organizations
     marked "BAA Status: Executed", an invoiced PMPM figure and an $847K ROI
     estimate. None of that comes back here. This file is a pointer and nothing
     else, so the URL resolves to the real surface instead of 404-ing.

     NOT MANAGED BY seo_inject.py -- listed in tools/seo_shared.py's IGNORE set,
     because the injector writes index,follow and a self-canonical on
     gotovasl.com/prototype, which is the opposite of what a redirect needs, and
     canonical_for() cannot express a cross-origin target.

     Meta refresh rather than a 301: gotovasl.com is served from the S3 REST
     endpoint, not the website endpoint, so object-level redirect metadata is
     ignored. A true 301 would live in the CloudFront viewer-request function,
     which is Terraform-managed in another repo. -->
<title>VLAP — Vasl Language Analysis Platform | Vasl Health</title>

</style>
</head>
<body>
  <!-- Visible to anyone the refresh does not carry: no-JS, a blocked refresh, a
       crawler, or a reader on assistive tech who needs a real link. -->
  <main class="wrap">

    <p><a class="go" href="https://vlap-standalone.gotovasl.com/">Open VLAP</a></p>

    // replace(), not assign(): Back should return the reader to where they came
    // from, not to this page, which would bounce them straight out again.
    location.replace('https://vlap-standalone.gotovasl.com/');
  </script>
</body>
