[build]
  publish = "."

# NOTE: site/ moved to S3 + CloudFront on 2026-08-10 and CloudFront does not
# read this file, so nothing here is applied to the live site. Kept only so the
# directory is still buildable on Netlify; corrected rather than left pointing
# at two hostnames that no longer resolve.
#
# demo.gotovasl.com is NXDOMAIN and is not coming back — the page is served
# as a path on the main site instead.
[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
