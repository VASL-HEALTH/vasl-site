# Keeps the SEO layer honest.
#
# The head block, sitemap, and OG image are all generated. Without this check,
# the first hand-edit to a page silently drops its canonical tag or leaves the
# sitemap pointing at a URL that no longer exists — and nobody notices until
# rankings move, which is months later.
#
# This runs on PRs and on main. It never writes; it only fails if the generated
# artifacts are out of date, with the exact command to fix them.

name: SEO check

on:
  # PULL_REQUEST AND PUSH TRIGGERS REMOVED 2026-10-13, Rodney's instruction.
  # `python tools/seo_validate.py` runs locally before a push, alongside
  # tools/check_copy.py and tools/check_forms.py. This file had no
  # workflow_dispatch, so one is added here: without it, removing the two
  # triggers would leave the workflow with no way to run at all.
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gen_sitemap reads git log for <lastmod>

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Head layer is current
        run: python3 tools/seo_inject.py --check

      - name: Internal links are current
        run: python3 tools/internal_links.py --check

      - name: Sitemap is current
        run: python3 tools/gen_sitemap.py --check

      - name: Validate SEO invariants
        run: python3 tools/seo_validate.py
